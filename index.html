<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacer - Závody v psaní</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="race-arena">
            <!-- HUD with stats -->
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">Pozice</span>
                    <span class="hud-value" id="pos-val">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Kolo</span>
                    <span class="hud-value"><span id="lap-val">1</span>/<span id="total-laps-hud">3</span></span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Rychlost (CPM)</span>
                    <span class="hud-value" id="speed-val">0</span>
                    <div id="nitro-container"><div id="nitro-bar"></div></div>
                </div>
            </div>

            <!-- SVG Track -->
            <svg id="track-svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">
                <!-- Asphalt Base -->
                <path id="track-base" d="M200,512 L400,512 C400,512 500,512 600,412 C700,312 800,212 1000,212 C1200,212 1336,412 1336,512 C1336,612 1200,812 1000,812 C800,812 700,712 600,612 C500,512 400,512 300,512 L200,512"
                    fill="none" stroke="#cbd5e1" stroke-width="120" stroke-linecap="round" />

                <!-- Track Surface -->
                <path id="track-surface" d="M200,512 L400,512 C400,512 500,512 600,412 C700,312 800,212 1000,212 C1200,212 1336,412 1336,512 C1336,612 1200,812 1000,812 C800,812 700,712 600,612 C500,512 400,512 300,512 L200,512"
                    fill="none" stroke="#f1f5f9" stroke-width="110" stroke-linecap="round" />

                <!-- Center Line -->
                <path id="track-path" d="M200,512 L400,512 C400,512 500,512 600,412 C700,312 800,212 1000,212 C1200,212 1336,412 1336,512 C1336,612 1200,812 1000,812 C800,812 700,712 600,612 C500,512 400,512 300,512 L200,512"
                    fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="20,30" opacity="0.3" />

                <!-- Finish Line -->
                <line x1="200" y1="452" x2="200" y2="572" stroke="#2563eb" stroke-width="8" stroke-linecap="butt" />
                <line x1="210" y1="452" x2="210" y2="572" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" />
            </svg>

            <!-- Cars -->
            <div id="player-car" class="car"></div>
            <div id="ai-car" class="car" style="display: none;"></div>

            <!-- Countdown -->
            <div id="countdown"></div>
        </div>

        <!-- Start/Menu Overlay -->
        <div id="overlay-container">
            <div id="main-menu" class="menu-card">
                <h1>TYPERACER CZ</h1>
                <p class="tagline">Závoďte s časem i soupeři pomocí svého psaní!</p>

                <div id="difficulty-selection">
                    <span class="label-small">Obtížnost AI</span>
                    <div class="option-group">
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('easy')">Lehká</button>
                        <button class="difficulty-btn option-btn active" onclick="setDifficulty('medium')">Střední</button>
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('hard')">Těžká</button>
                    </div>

                    <span class="label-small" style="margin-top: 15px;">Počet kol</span>
                    <div class="option-group">
                        <button class="lap-btn option-btn" onclick="setLaps(1)">1</button>
                        <button class="lap-btn option-btn active" onclick="setLaps(3)">3</button>
                        <button class="lap-btn option-btn" onclick="setLaps(5)">5</button>
                    </div>

                    <span class="label-small" style="margin-top: 15px;">Vyberte si auto</span>
                    <div id="car-selection" class="option-group">
                        <!-- Cars will be injected by JS -->
                    </div>
                </div>

                <div id="results" class="menu-card" style="display: none; box-shadow: none; padding: 0;">
                    <div id="medal-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
                    <h2 id="winner-text">VYHRÁL JSTE!</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-val" id="cpm-val">0</span>
                            <span class="stat-label">CPM</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-val" id="accuracy-val">0</span>
                            <span class="stat-label">% Přesnost</span>
                        </div>
                    </div>
                    <p id="new-best-msg" style="color: #f1c40f; display: none; margin-bottom: 15px; font-weight: bold;">NOVÝ OSOBNÍ REKORD!</p>
                </div>

                <div class="btn-group" style="margin-top: 30px;">
                    <button class="main-btn" onclick="startGame('race')">ZÁVODIT</button>
                    <button class="secondary-btn" onclick="startGame('practice')">TRÉNINK</button>
                </div>

                <div style="margin-top: 20px; font-size: 0.8rem; color: #8892b0;">
                    Osobní rekord: <span id="pb-val-menu">0</span> CPM
                </div>
            </div>
        </div>
    </div>

    <!-- Typing Area -->
    <div id="typing-area">
        <div id="sentence-display">Načítání...</div>
        <input type="text" id="typing-input" placeholder="Pište text výše pro zrychlení..." autocomplete="off" spellcheck="false">
    </div>

    <script src="game.js"></script>
</body>
</html>
