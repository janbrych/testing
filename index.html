<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacer - Závody v psaní</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="race-arena">
            <!-- HUD with stats -->
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">Pozice</span>
                    <span class="hud-value" id="pos-val">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Kolo</span>
                    <span class="hud-value"><span id="lap-val">1</span>/<span id="total-laps-hud">3</span></span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Rychlost (CPM)</span>
                    <span class="hud-value" id="speed-val">0</span>
                    <div id="nitro-container"><div id="nitro-bar"></div></div>
                </div>
            </div>

            <!-- SVG Track -->
            <svg id="track-svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <pattern id="grass" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                        <rect width="100" height="100" fill="#f8fafc"/>
                        <circle cx="10" cy="10" r="1" fill="#e2e8f0"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grass)" />

                <!-- Scenic elements -->
                <circle cx="750" cy="212" r="100" fill="#cbd5e1" opacity="0.2" />
                <circle cx="300" cy="812" r="120" fill="#cbd5e1" opacity="0.2" />
                <circle cx="1300" cy="812" r="80" fill="#cbd5e1" opacity="0.2" />

                <!-- Asphalt Base -->
                <path id="track-base" d="M150,512 L350,512 C450,512 500,212 750,212 S1050,512 1050,512 C1050,512 1100,812 1300,812 S1450,512 1450,512 C1450,512 1450,212 1250,212 S1000,462 800,512 C600,562 500,812 300,812 S150,512 150,512"
                    fill="none" stroke="#cbd5e1" stroke-width="140" stroke-linecap="round" />

                <!-- Track Curbs (red/white) -->
                <path d="M150,512 L350,512 C450,512 500,212 750,212 S1050,512 1050,512 C1050,512 1100,812 1300,812 S1450,512 1450,512 C1450,512 1450,212 1250,212 S1000,462 800,512 C600,562 500,812 300,812 S150,512 150,512"
                    fill="none" stroke="#ef4444" stroke-width="120" stroke-dasharray="40,40" />

                <!-- Track Surface -->
                <path id="track-surface" d="M150,512 L350,512 C450,512 500,212 750,212 S1050,512 1050,512 C1050,512 1100,812 1300,812 S1450,512 1450,512 C1450,512 1450,212 1250,212 S1000,462 800,512 C600,562 500,812 300,812 S150,512 150,512"
                    fill="none" stroke="#ffffff" stroke-width="110" stroke-linecap="round" />

                <!-- Center Line -->
                <path id="track-path" d="M150,512 L350,512 C450,512 500,212 750,212 S1050,512 1050,512 C1050,512 1100,812 1300,812 S1450,512 1450,512 C1450,512 1450,212 1250,212 S1000,462 800,512 C600,562 500,812 300,812 S150,512 150,512"
                    fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="20,30" opacity="0.2" />

                <!-- Finish Line -->
                <line x1="150" y1="442" x2="150" y2="582" stroke="#2563eb" stroke-width="8" stroke-linecap="butt" />
                <line x1="160" y1="442" x2="160" y2="582" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" />

                <!-- SVG Cars -->
                <g id="player-car" class="car-svg">
                    <rect x="-15" y="-25" width="30" height="50" rx="8" class="car-body" fill="#2563eb" />
                    <rect x="-12" y="-12" width="24" height="15" rx="3" fill="rgba(255,255,255,0.4)" />
                    <rect x="-12" y="15" width="24" height="4" rx="1" fill="rgba(0,0,0,0.2)" />
                </g>
                <g id="ai-car" class="car-svg" style="display: none;">
                    <rect x="-15" y="-25" width="30" height="50" rx="8" class="car-body" fill="#64748b" />
                    <rect x="-12" y="-12" width="24" height="15" rx="3" fill="rgba(255,255,255,0.4)" />
                    <rect x="-12" y="15" width="24" height="4" rx="1" fill="rgba(0,0,0,0.2)" />
                </g>
            </svg>

            <!-- Effects -->
            <div id="speed-lines" class="speed-lines"></div>
            <div id="combo-ui" class="combo-counter">0x</div>

            <!-- Countdown -->
            <div id="countdown"></div>
        </div>

        <!-- Start/Menu Overlay -->
        <div id="overlay-container">
            <div id="main-menu" class="menu-card">
                <h1 id="ui-title">TYPERACER CZ</h1>
                <p class="tagline" id="ui-tagline">Závoďte s časem i soupeři pomocí svého psaní!</p>

                <div id="difficulty-selection">
                    <span class="label-small" id="ui-language-label">Jazyk / Language</span>
                    <div class="option-group">
                        <button class="lang-btn option-btn active" onclick="setLanguage('cs')">Čeština</button>
                        <button class="lang-btn option-btn" onclick="setLanguage('en')">English</button>
                    </div>

                    <span class="label-small" id="ui-difficulty-label" style="margin-top: 15px;">Obtížnost AI</span>
                    <div class="option-group">
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('easy')" id="ui-diff-easy">Lehká</button>
                        <button class="difficulty-btn option-btn active" onclick="setDifficulty('medium')" id="ui-diff-medium">Střední</button>
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('hard')" id="ui-diff-hard">Těžká</button>
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('wr')" id="ui-diff-wr">Světový Rekord</button>
                    </div>

                    <span class="label-small" id="ui-laps-label" style="margin-top: 15px;">Počet kol</span>
                    <div class="option-group">
                        <button class="lap-btn option-btn" onclick="setLaps(1)">1</button>
                        <button class="lap-btn option-btn active" onclick="setLaps(3)">3</button>
                        <button class="lap-btn option-btn" onclick="setLaps(5)">5</button>
                    </div>

                    <span class="label-small" id="ui-car-label" style="margin-top: 15px;">Vyberte si auto</span>
                    <div id="car-selection" class="option-group">
                        <!-- Cars will be injected by JS -->
                    </div>
                </div>

                <div id="results" class="menu-card" style="display: none; box-shadow: none; padding: 0;">
                    <div id="medal-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
                    <h2 id="winner-text">VYHRÁL JSTE!</h2>
                    <div id="rank-display" style="font-size: 6rem; font-weight: 900; color: #2563eb; margin: 10px 0;">S</div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-val" id="cpm-val">0</span>
                            <span class="stat-label">CPM</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-val" id="accuracy-val">0</span>
                            <span class="stat-label">% Přesnost</span>
                        </div>
                    </div>
                    <p id="new-best-msg" style="color: #f1c40f; display: none; margin-bottom: 15px; font-weight: bold;">NOVÝ OSOBNÍ REKORD!</p>
                </div>

                <div class="btn-group" style="margin-top: 30px;">
                    <button id="start-btn" class="main-btn" onclick="startGame('race')">ZÁVODIT</button>
                    <button id="back-btn" class="secondary-btn" onclick="resetGame()" style="display: none;">ZPĚT DO MENU</button>
                    <button id="practice-btn" class="secondary-btn" onclick="startGame('practice')">TRÉNINK</button>
                </div>

                <div style="margin-top: 20px; font-size: 0.8rem; color: #8892b0;">
                    <span id="ui-pb-label">Osobní rekord</span>: <span id="pb-val-menu">0</span> CPM
                </div>
            </div>
        </div>
    </div>

    <!-- Typing Area -->
    <div id="typing-area">
        <div id="sentence-display">Načítání...</div>
        <input type="text" id="typing-input" placeholder="Pište text výše pro zrychlení..." autocomplete="off" spellcheck="false">
    </div>

    <script src="sentences.js"></script>
    <script src="game.js"></script>
</body>
</html>
