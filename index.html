<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Racer - Typing Speed Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Type Racer</h1>
        <div id="countdown"></div>

        <div id="difficulty-selection">
            <p>Vyberte obtížnost:</p>
            <button class="difficulty-btn" onclick="setDifficulty('easy')">Lehká</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">Střední</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">Těžká</button>

            <div id="race-options" style="margin-top: 20px;">
                <p>Počet kol:
                    <select id="lap-select">
                        <option value="1">1 kolo</option>
                        <option value="3">3 kola</option>
                        <option value="5">5 kol</option>
                    </select>
                </p>
                <button onclick="startGame('race')" id="start-race-btn">Závod!</button>
                <button onclick="startGame('practice')" id="start-practice-btn">Trénink</button>
            </div>
        </div>

        <div id="race-track-container">
            <div id="lap-counter" style="display:none;">Kolo: <span id="current-lap">1</span> / <span id="total-laps">1</span></div>
            <svg id="race-track-svg" viewBox="0 0 800 400">
                <!-- Complex winding track path -->
                <!-- Outer road surface -->
                <path id="track-surface" d="M 100,200 C 100,100 250,50 400,100 S 550,250 700,200 S 700,350 400,350 S 100,300 100,200" fill="none" stroke="#555" stroke-width="70" />
                <!-- The actual path the cars follow -->
                <path id="track-path" d="M 100,200 C 100,100 250,50 400,100 S 550,250 700,200 S 700,350 400,350 S 100,300 100,200" fill="none" stroke="transparent" stroke-width="60" />
                <!-- Road markings -->
                <path id="track-center-line" d="M 100,200 C 100,100 250,50 400,100 S 550,250 700,200 S 700,350 400,350 S 100,300 100,200" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="20,15" />
            </svg>
            <div id="player-car" class="car"></div>
            <div id="ai-car" class="car"></div>
        </div>

        <div id="typing-area" style="display:none;">
            <div id="sentence-display"></div>
            <input type="text" id="typing-input" placeholder="Začněte psát zde..." autocomplete="off">
        </div>

        <div id="results" style="display:none;">
            <h2>Výsledky závodu</h2>
            <p id="winner-text"></p>
            <p>Přesnost: <span id="accuracy-val">0</span>%</p>
            <p>CPM: <span id="cpm-val">0</span></p>
            <button onclick="resetGame()">Hrát znovu</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
