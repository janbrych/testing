<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacer - Závody v psaní</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="race-arena">
            <!-- HUD with stats -->
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">Pozice</span>
                    <span class="hud-value" id="pos-val">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Kolo</span>
                    <span class="hud-value"><span id="lap-val">1</span>/<span id="total-laps-hud">3</span></span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Rychlost (CPM)</span>
                    <span class="hud-value" id="speed-val">0</span>
                    <div id="nitro-container"><div id="nitro-bar"></div></div>
                </div>
            </div>

            <!-- SVG Track -->
            <svg id="track-svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)" />

                <!-- Shadow/Glow of the track -->
                <path id="track-path-glow" d="M100,800 C100,800 200,950 500,900 C800,850 900,600 700,500 C500,400 300,600 200,400 C100,200 400,100 800,150 C1200,200 1400,400 1400,600 C1400,800 1200,900 1000,850 C800,800 800,700 1000,650 C1200,600 1300,700 1200,800 C1100,900 300,850 100,800 Z"
                    fill="none" stroke="rgba(241, 196, 15, 0.1)" stroke-width="90" stroke-linecap="round" />

                <!-- Asphalt Base -->
                <path id="track-base" d="M100,800 C100,800 200,950 500,900 C800,850 900,600 700,500 C500,400 300,600 200,400 C100,200 400,100 800,150 C1200,200 1400,400 1400,600 C1400,800 1200,900 1000,850 C800,800 800,700 1000,650 C1200,600 1300,700 1200,800 C1100,900 300,850 100,800 Z"
                    fill="none" stroke="#333" stroke-width="80" stroke-linecap="round" />

                <!-- Lane Inner -->
                <path id="track-lane" d="M100,800 C100,800 200,950 500,900 C800,850 900,600 700,500 C500,400 300,600 200,400 C100,200 400,100 800,150 C1200,200 1400,400 1400,600 C1400,800 1200,900 1000,850 C800,800 800,700 1000,650 C1200,600 1300,700 1200,800 C1100,900 300,850 100,800 Z"
                    fill="none" stroke="#444" stroke-width="70" stroke-linecap="round" />

                <!-- Dashed Center Line -->
                <path id="track-path" d="M100,800 C100,800 200,950 500,900 C800,850 900,600 700,500 C500,400 300,600 200,400 C100,200 400,100 800,150 C1200,200 1400,400 1400,600 C1400,800 1200,900 1000,850 C800,800 800,700 1000,650 C1200,600 1300,700 1200,800 C1100,900 300,850 100,800 Z"
                    fill="none" stroke="#eee" stroke-width="2" stroke-dasharray="20,30" />
            </svg>

            <!-- Cars -->
            <div id="player-car" class="car"></div>
            <div id="ai-car" class="car" style="display: none;"></div>

            <!-- Countdown -->
            <div id="countdown"></div>
        </div>

        <!-- Start/Menu Overlay -->
        <div id="overlay-container">
            <div id="main-menu" class="menu-card">
                <h1>TYPERACER CZ</h1>
                <p class="tagline">Závoďte s časem i soupeři pomocí svého psaní!</p>

                <div id="difficulty-selection">
                    <span class="label-small">Obtížnost AI</span>
                    <div class="option-group">
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('easy')">Lehká</button>
                        <button class="difficulty-btn option-btn active" onclick="setDifficulty('medium')">Střední</button>
                        <button class="difficulty-btn option-btn" onclick="setDifficulty('hard')">Těžká</button>
                    </div>

                    <span class="label-small" style="margin-top: 15px;">Počet kol</span>
                    <div class="option-group">
                        <button class="lap-btn option-btn" onclick="setLaps(1)">1</button>
                        <button class="lap-btn option-btn active" onclick="setLaps(3)">3</button>
                        <button class="lap-btn option-btn" onclick="setLaps(5)">5</button>
                    </div>
                </div>

                <div id="results" class="menu-card" style="display: none; box-shadow: none; padding: 0;">
                    <div id="medal-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
                    <h2 id="winner-text">VYHRÁL JSTE!</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-val" id="cpm-val">0</span>
                            <span class="stat-label">CPM</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-val" id="accuracy-val">0</span>
                            <span class="stat-label">% Přesnost</span>
                        </div>
                    </div>
                    <p id="new-best-msg" style="color: #f1c40f; display: none; margin-bottom: 15px; font-weight: bold;">NOVÝ OSOBNÍ REKORD!</p>
                </div>

                <div class="btn-group" style="margin-top: 30px;">
                    <button class="main-btn" onclick="startGame('race')">ZÁVODIT</button>
                    <button class="secondary-btn" onclick="startGame('practice')">TRÉNINK</button>
                </div>

                <div style="margin-top: 20px; font-size: 0.8rem; color: #8892b0;">
                    Osobní rekord: <span id="pb-val-menu">0</span> CPM
                </div>
            </div>
        </div>
    </div>

    <!-- Typing Area -->
    <div id="typing-area">
        <div id="sentence-display">Načítání...</div>
        <input type="text" id="typing-input" placeholder="Pište text výše pro zrychlení..." autocomplete="off" spellcheck="false">
    </div>

    <script src="game.js"></script>
</body>
</html>
